# Android 构建的公共参数（桌面 JVM 四道闸也读这一份）
# 注意：不要加 -Dfile.encoding=UTF-8 —— 本机工具链路径含中文，daemon 用 UTF-8 写
# worker argfile、Windows JVM 却按 GBK 读，会让 GradleWorkerMain 的 classpath 直接失效。
org.gradle.jvmargs=-Xmx4g
# 全量重编译时默认以 6g 守护进程为准（M4-F 实测默认堆会 OOM）
kotlin.daemon.jvmargs=-Xmx6g
# androidx.test 系列（androidTest 取证装置）需要 AndroidX 开关；本仓仍不引入 support library。
# 运行时依赖照旧只有 :core-vm/:render-canvas/:platform 三个本地模块。
android.useAndroidX=true
# 共享根含中文（Haruki 的 C:/DSH/eratw-安卓移植计划、HOMEJIA 的 D:/DSH/eratw-安卓移植计划），
# AGP 的路径检查会直接拒绝配置；桌面 JVM 四道闸只跑纯 JVM 模块，显式关掉这道检查
# （仅跳过检查本身，不改任何构建行为；2026-10-20/21 的 .qoder worktree 内出包实测
# dex/资源/签名都不踩路径）。
android.overridePathCheck=true
