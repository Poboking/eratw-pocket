# 语料内容补丁索引 —— specs/corpus-bugs.md §3 的机制资产（首个补丁 CB-001 随机制落地）。
#
# 消费方 = buildSrc 的 CorpusPatches（:tools:erbcc:compileCorpus 执行前解析）。
# 这是**窄 schema**，手写解析、不引 YAML 库；不认识的行一律判红，宁红不猜。
# 字段（除 root / skip-sha256 外全部必填）：
#   id           台账 id（= specs/corpus-bugs.md §1 的行）
#   target       目标文件相对路径，相对 root 指定的根，'/' 分隔
#   root         目标根（可选，缺省 corpus）：corpus = compileCorpus 的 corpus 根（=<游戏根>/ERB）；
#                game = 游戏根（CSV/_Rename.csv 这类与 ERB 平级的随包数据）。root=game 的补丁
#                同时作用于编译 staging 副本与出包资产 staging（两处判据同源，避免「erbc 修了、随包数据没修」）
#   patch        unified diff 资产文件名（与本索引同目录）
#   bad-sha256   病灶版目标文件 sha256（小写 64 hex）。命中 = 应用补丁
#   fixed-sha256 修后版目标文件 sha256（小写 64 hex）。命中 = 已是修后版，跳过；
#                套用后产物 sha 也必须等于它（双重判据，套用器 bug 兜底）
#   skip-sha256  可选，逗号分隔的「已知不进入本链的版本」sha256。两类：① 该版本病灶已不存在
#                （如 4.980 根已有同一批键，CB-005）；② 该版本不是本链的出包对象、须保持编译
#                基准原始字节（如 4.980 canonical 之于 CB-006/008）——② **不代表病灶已修**，
#                若它被改作出包根必须另立该版本的 bad/fixed 链。命中 = 跳过留痕；其余未知 sha 仍判红
#   corpus       适用语料版本（台账「语料落点」列的根名；不在册的语料靠 sha 三档自然判定）
#   status       台账状态（改这里要连 specs/corpus-bugs.md §1 的处置列一起改）
#   summary      病灶/修法摘要（单行；不要换行折叠）
#   evidence     证据指针（台账行 / 上报正文样张）
#
# 判定：目标缺席=跳过留痕（原样直编）；sha=bad=套用；sha=fixed=已是修后版跳过；
# sha∈链头 skip-sha256=已知不进入本链的版本，整链跳过留痕；其余不命中=未知漂移，判红
#（防上游语料换版悄悄绕过补丁）。
#
# 整表不适用（第三方 era 游戏出包，CONTRACT-ENGCOMPAT §8.0.5）：pack `--foreign-corpus`
#   = `-PeratwForeignCorpus=1`，声明本根不是上面 corpus 列的那个 eraTW 根 ⇒ 编译面与出包
#   staging 面同时跳过整表（不套、也不要求本目录在场）。必须配显式 --game-root，且**只能显式**：
#   不从 -PeratwEngineProfile 推（用缺省 snake 档重编 eraTW 是合法组合，那种包仍要吃这批补丁）。
#   不带该声明时，出包 staging 面对「目标缺席」仍判红 —— 比编译面严是刻意的，
#   防的是 eraTW 出包根指错却静默少随一份修后 CSV（CorpusPatchesTest 两侧都钉着）。
#
# 261111 出包语料根取得口径（2026-11-15，Haruki）：官方仓 gitgud
#   `era-games-zh/touhou/eratw-sub-modding` 提交
#   278662ced155253f47daf514bbf0dbad44e0e3b7（2026-11-11 23:12）的 archive.zip，
#   走 Clash 7890 取回。仓 blob 为 LF、磁盘发行根为 CRLF ⇒ 文本文件做 LF→CRLF 归一、
#   二进制原样；还原后 CB-001/005/006/009 四个目标文件 sha256 与本表 261111 病灶值
#   逐字吻合（四点自证），故本表全部 bad/fixed sha 均可按真实出包字节复算。
#   新增补丁的 fixed sha 由与 CorpusPatches.kt:692-953 逐点对齐的离线套用器语义模拟器
#   预计算（该模拟器已用本表原有链反向自证），编译期「套后 sha == fixed」双重判据兜底。
