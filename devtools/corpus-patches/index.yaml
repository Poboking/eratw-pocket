# 语料内容补丁索引 —— specs/corpus-bugs.md §3 的机制资产（首个补丁 CB-001 随机制落地）。
#
# 消费方 = buildSrc 的 CorpusPatches（:tools:erbcc:compileCorpus 执行前解析）。
# 这是**窄 schema**，手写解析、不引 YAML 库；不认识的行一律判红，宁红不猜。
# 字段（除 root / skip-sha256 外全部必填）：
#   id           台账 id（= specs/corpus-bugs.md §1 的行）
#   target       目标文件相对路径，相对 root 指定的根，'/' 分隔
#   root         目标根（可选，缺省 corpus）：corpus = compileCorpus 的 corpus 根（=<游戏根>/ERB）；
#                game = 游戏根（CSV/_Rename.csv 这类与 ERB 平级的随包数据）。root=game 的补丁
#                同时作用于编译 staging 副本与出包资产 staging（两处判据同源，避免「erbc 修了、随包数据没修」）
#   patch        unified diff 资产文件名（与本索引同目录）
#   bad-sha256   病灶版目标文件 sha256（小写 64 hex）。命中 = 应用补丁
#   fixed-sha256 修后版目标文件 sha256（小写 64 hex）。命中 = 已是修后版，跳过；
#                套用后产物 sha 也必须等于它（双重判据，套用器 bug 兜底）
#   skip-sha256  可选，逗号分隔的「已知无需补丁的版本」sha256（如 4.980 根已有同一批键）。
#                命中 = 跳过留痕；其余未知 sha 仍判红
#   corpus       适用语料版本（台账「语料落点」列的根名；不在册的语料靠 sha 三档自然判定）
#   status       台账状态（改这里要连 specs/corpus-bugs.md §1 的处置列一起改）
#   summary      病灶/修法摘要（单行；不要换行折叠）
#   evidence     证据指针（台账行 / 上报正文样张）
#
# 判定：目标缺席=跳过留痕（原样直编）；sha=bad=套用；sha=fixed=已是修后版跳过；
# sha∈skip-sha256=已知无需补丁的版本跳过；其余不命中=未知漂移，判红（防上游语料换版悄悄绕过补丁）。
