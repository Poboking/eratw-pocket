name: Update player badges

# README 的两颗徽章现在**直连 Worker** 的 shields 端点（/players 与 ?metric=active，
# cacheSeconds=300），刷新延迟只有 shields / 图片代理的几分钟缓存；实测 GitHub 对
# `*/30` 的 schedule 节流到 4~8 小时才触发一次（11-11 起每天只跑 3~4 次），走静态文件
# 时徽章会跟着冻上大半天，这正是「徽章好几个小时不动」的根因。
# 本 workflow 因此降级为**回退快照**：每天取一次公开只读的 /players/raw，把聚合数写成
# 仓库内 badges/*.json，端点故障或迁移时把 README 两行徽章改回 raw.githubusercontent 即可。
# 取不到读数时保留上一次的值，不会把 0 冒充真实玩家数；读数被标注截断时按「至少这么多」
# 显示并带 +，避免一次列举分页上限把徽章永久冻在旧快照上；人数 >= 1000 按 1000 进制缩写。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:


permissions:
  contents: write

concurrency:
  group: update-player-badges
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 仓库变量可覆盖端点（Settings → Secrets and variables → Actions → Variables）。
      # 没配就用部署 runbook 里的自定义域名。这是公开只读出口，不需要任何 secret。
      PLAYER_STATS_RAW_URL: ${{ vars.PLAYER_STATS_RAW_URL || 'https://eratw-android.asia/players/raw' }}
    steps:
      - uses: actions/checkout@v4

      - name: 徽章数字格式化自检（离线，不依赖端点）
        shell: bash
        run: python3 .github/scripts/update_player_badges.py --selftest

      - name: 取一次玩家数原始读数
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/players-raw.json"
          # curl 失败 / 非 2xx / 超时都不算 CI 失败：Worker 可能还没部署。
          if ! curl -fsS --max-time 20 --retry 1 \
              -H 'Accept: application/json' \
              "$PLAYER_STATS_RAW_URL" -o "$raw"; then
            echo "::notice::玩家数端点暂时取不到（可能还没部署），保留已有徽章 JSON"
            exit 0
          fi
          echo "raw=$raw" >> "$GITHUB_OUTPUT"
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - name: 生成两枚 shields endpoint 徽章 JSON
        if: steps.fetch.outputs.fetched == 'true'
        shell: bash
        run: python3 .github/scripts/update_player_badges.py "$RUNNER_TEMP/players-raw.json" badges

      - name: 有变化才提交
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/players.json badges/active-today.json; then
            echo "读数没变或本轮跳过，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/players.json badges/active-today.json
          git commit -m "chore(badges): refresh anonymous player counts [skip ci]"
          git push
