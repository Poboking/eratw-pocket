name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 引擎仓必须与本仓同级检出（settings.gradle.kts 的 includeBuild("../erak-engine")）
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/erak-engine
          ref: main
          path: erak-engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 把 erak-engine 链接到本仓同级
        run: ln -s "$GITHUB_WORKSPACE/erak-engine" "$GITHUB_WORKSPACE/../erak-engine"

      - name: 编译 debug 包 + 单测（-PeratwSkipAssets：CI 无语料）
        # 4 个语料 / 真 GAMEBASE 门控用例按 JUnit assumption 跳过；其余全部真跑。
        run: ./gradlew --no-daemon :app:assembleDebug -PeratwSkipAssets :app:testDebugUnitTest :platform:testDebugUnitTest
