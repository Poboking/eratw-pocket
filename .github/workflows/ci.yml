name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 引擎仓必须与本仓同级检出（settings.gradle.kts 的 includeBuild("../Kotera")）
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Kotera
          ref: main
          path: Kotera

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 把 Kotera 链接到本仓同级
        run: ln -s "$GITHUB_WORKSPACE/Kotera" "$GITHUB_WORKSPACE/../Kotera"

      - name: Source gates (data source / business words / corpus-specific names)
        run: python3 devtools/test_source_gates.py

      - name: Shell profile gate
        run: python3 devtools/test_shell_profile.py

      - name: Game version ledger gate
        run: python3 devtools/test_game_versions.py

      - name: 编译 debug 包 + 单测（-PeratwSkipAssets：CI 无语料）
        # 4 个语料 / 真 GAMEBASE 门控用例按 JUnit assumption 跳过；其余全部真跑。
        run: ./gradlew --no-daemon :app:assembleDebug -PeratwSkipAssets :app:testDebugUnitTest :platform:testDebugUnitTest

  badge-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 徽章数字格式化自检（离线，不依赖端点）
        run: python3 .github/scripts/update_player_badges.py --selftest
